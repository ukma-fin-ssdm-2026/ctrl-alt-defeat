# Settings for SonarQube Cloud automatic analysis (https://docs.sonarsource.com/sonarqube-cloud/).

# Python version of CI and the Docker image (analysis warning: "analyzed as compatible with 3.10-3.14")
sonar.python.version=3.11

# Test code is analysed as tests, not as production code (analysis warning: "sonar.tests is not configured").
# Sources and tests both start at the repository root and are separated by the inclusion/exclusion patterns.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=tests/**,frontend/src/**/*.test.js,frontend/src/**/*.test.jsx,frontend/e2e/**

# Generated files are excluded, otherwise they distort the metrics (Lab 8); test files are not production code
sonar.exclusions=htmlcov/**,coverage/**,frontend/dist/**,frontend/coverage/**,docs/api/openapi-generated.yaml,requirements-lock.txt,tests/**,frontend/src/**/*.test.js,frontend/src/**/*.test.jsx,frontend/e2e/**
