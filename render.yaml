# Render Blueprint: the whole site (FastAPI + built React app, one Docker image).
# Render dashboard -> New -> Blueprint -> pick this repository. Docs: https://render.com/docs/blueprint-spec
#
# The database is a free Neon PostgreSQL (https://neon.tech): unlike Render's free PostgreSQL it does not
# expire after 30 days, so registered users and reviews are kept.
services:
  - type: web
    name: ctrl-alt-defeat
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    branch: main
    # Liveness only: Render checks often, and /health/live does not wake the serverless database.
    # /health (with the database check) stays for monitoring and the CI smoke test.
    healthCheckPath: /health/live
    # Deploy a new commit on main only after the GitHub checks (CI) have passed
    autoDeployTrigger: checksPass
    envVars:
      # Neon connection string (Neon console -> Connect), asked once when the Blueprint is created
      - key: DATABASE_URL
        sync: false
      # Random values generated by Render once, on the first deploy; never stored in the repository
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: SEED_ADMIN_PASSWORD
        generateValue: true
      - key: SEED_USER_PASSWORD
        generateValue: true
      # Public demo: the login window shows only the regular user account; the admin password is in
      # the Render dashboard (Environment) and is handed to the reviewers privately
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_ROLES
        value: user
      # Optional, asked once when the Blueprint is created; empty = built-in catalog
      - key: TMDB_API_KEY
        sync: false
