# Render Blueprint of the live service "pislya-tytriv" (https://pislya-tytriv.onrender.com):
# the whole site (FastAPI + built React app, one Docker image). Docs: https://render.com/docs/blueprint-spec
#
# The Blueprint was generated from the existing service (Render -> service -> "Generate Blueprint") and
# connected to it, so Render manages that service from this file. Do NOT create another Blueprint from this
# repository with "New -> Blueprint": it would create a second service with a suffixed address and deploy
# every commit twice. A service address (*.onrender.com) cannot be changed or reused after deletion.
#
# The database is a free Neon PostgreSQL (https://neon.tech): unlike Render's free PostgreSQL it does not
# expire after 30 days, so registered users and reviews are kept.
version: "1"
services:
  - type: web
    name: pislya-tytriv
    runtime: docker
    repo: https://github.com/ukma-fin-ssdm-2026/ctrl-alt-defeat
    branch: main
    dockerContext: .
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    # Liveness only: Render checks often, and /health/live does not wake the serverless database.
    # /health (with the database check) stays for monitoring and the CI smoke test.
    healthCheckPath: /health/live
    # Deploy every new commit on main. main is protected: a change lands only through a PR whose
    # "build" check passed. "checksPass" is not used on purpose: Render would wait for every check of
    # the commit, including the "Production deployment" job that itself waits for this deploy (deadlock).
    autoDeployTrigger: commit
    # Values live only in the Render dashboard (Environment). "sync: false" never overwrites them,
    # so syncing the Blueprint keeps the existing secrets and sessions.
    envVars:
      # Neon connection string (Neon console -> Connect)
      - key: DATABASE_URL
        sync: false
      # Random secrets; changing JWT_SECRET_KEY logs every user out
      - key: JWT_SECRET_KEY
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      - key: SEED_USER_PASSWORD
        sync: false
      # Public demo: the login window shows only the regular user account ("true" / "user");
      # the admin password is handed to the reviewers privately
      - key: DEMO_MODE
        sync: false
      - key: DEMO_ROLES
        sync: false
      # Optional; empty = built-in catalog
      - key: TMDB_API_KEY
        sync: false
      # FR-001 activation emails through the Google Apps Script relay (scripts/google-apps-script/mailer.gs):
      # Render free services block SMTP ports and email APIs need an own domain. Without them the link is
      # only written to the service log and new accounts cannot be confirmed.
      # Links point to RENDER_EXTERNAL_URL, which Render sets automatically.
      - key: GOOGLE_SCRIPT_URL
        sync: false
      - key: GOOGLE_SCRIPT_SECRET
        sync: false
