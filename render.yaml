# Render Blueprint: the whole site (FastAPI + built React app, one Docker image).
# Render dashboard -> New -> Blueprint -> pick this repository. Docs: https://render.com/docs/blueprint-spec
#
# The database is a free Neon PostgreSQL (https://neon.tech): unlike Render's free PostgreSQL it does not
# expire after 30 days, so registered users and reviews are kept.
services:
  - type: web
    name: pislya-tytriv
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    branch: main
    # Liveness only: Render checks often, and /health/live does not wake the serverless database.
    # /health (with the database check) stays for monitoring and the CI smoke test.
    healthCheckPath: /health/live
    # Deploy every new commit on main. main is protected: a change lands only through a PR whose
    # "build" check passed. "checksPass" is not used on purpose: Render would wait for every check of
    # the commit, including the "Production deployment" job that itself waits for this deploy (deadlock).
    autoDeployTrigger: commit
    envVars:
      # Neon connection string (Neon console -> Connect), asked once when the Blueprint is created
      - key: DATABASE_URL
        sync: false
      # Random values generated by Render once, on the first deploy; never stored in the repository
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: SEED_ADMIN_PASSWORD
        generateValue: true
      - key: SEED_USER_PASSWORD
        generateValue: true
      # Public demo: the login window shows only the regular user account; the admin password is in
      # the Render dashboard (Environment) and is handed to the reviewers privately
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_ROLES
        value: user
      # Optional, asked once when the Blueprint is created; empty = built-in catalog
      - key: TMDB_API_KEY
        sync: false
      # FR-001 activation emails through the Google Apps Script relay (scripts/google-apps-script/mailer.gs):
      # Render free services block SMTP ports and email APIs need an own domain. Set both in the dashboard;
      # without them the link is only written to the service log and new accounts cannot be confirmed.
      # Links point to RENDER_EXTERNAL_URL, which Render sets automatically.
      - key: GOOGLE_SCRIPT_URL
        sync: false
      - key: GOOGLE_SCRIPT_SECRET
        sync: false
