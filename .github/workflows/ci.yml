name: CI Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install locked dependencies
        run: |
          python -m pip install --only-binary :all: -r requirements.txt

      - name: Check that requirements-lock.txt matches requirements.txt
        run: |
          python scripts/check_requirements_lock.py

      - name: Check formatting (black)
        run: |
          black --check .

      - name: Run Linters & Security Scan
        run: |
          ruff check .
          bandit -r src/api -ll

      - name: Run Unit Tests with Coverage Gate
        run: |
          pytest --cov=src.api --cov-report=term --cov-fail-under=80 tests/

      - name: Verify RTM <-> Test Traceability
        run: |
          python scripts/verify_traceability.py

      - name: Verify OpenAPI Specification Sync
        run: |
          python -c "import sys; sys.path.insert(0, '.'); from src.api.main import app, save_openapi_spec; save_openapi_spec(app)"
          if [ -n "$(git status --porcelain docs/api/openapi-generated.yaml)" ]; then
            echo "::error::OpenAPI specification is out of sync with code! Please run the generator and commit docs/api/openapi-generated.yaml"
            git diff docs/api/openapi-generated.yaml
            exit 1
          fi
          echo "OpenAPI specification is synchronized with application code."

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # --ignore-scripts: dependency lifecycle scripts never run in CI (supply-chain safety)
      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Lint (ESLint)
        run: npm run lint

      - name: Unit & component tests (Vitest)
        run: npm test

      - name: Production build (Vite)
        run: npm run build

  secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Same gitleaks version as the pre-commit hook; the binary is used directly
      # (gitleaks-action requires a paid license for organization repositories)
      - name: Scan the repository history for secrets (gitleaks)
        env:
          GITLEAKS_VERSION: '8.21.1'
          # sha256 from the official gitleaks_8.21.1_checksums.txt release asset
          GITLEAKS_SHA256: 'b1e20dfbd81fa5eeefc91ace3371d4db75d2250c0d426cb6acf1e51722726779'
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          # HTTPS only, including every redirect (GitHub releases redirect to objects.githubusercontent.com)
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          ./gitleaks detect --source . --redact --verbose

  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build the application image
        run: docker build -t ctrl-alt-defeat:ci .

      - name: Smoke test the container (health check, API and website)
        run: |
          docker run -d --name app -p 8000:8000 -e JWT_SECRET_KEY=ci-smoke-test-only ctrl-alt-defeat:ci
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health; then break; fi
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/health | grep -q '"database":"ok"'
          curl -sf http://127.0.0.1:8000/health/live | grep -q '"status":"ok"'
          curl -sf "http://127.0.0.1:8000/api/v1/movies?limit=1" | grep -q '"total":[1-9]'
          curl -sf http://127.0.0.1:8000/ | grep -qi '<div id="root">'
          curl -sf http://127.0.0.1:8000/movies/42 | grep -qi '<div id="root">'

      - name: Show container logs on failure
        if: failure()
        run: docker logs app

