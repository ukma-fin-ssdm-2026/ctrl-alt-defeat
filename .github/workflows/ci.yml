name: CI Test & Spec Validation

on: [push, pull_request]

jobs:
  build:
    name: Build, Lint, Test & Validate Spec
    runs-on: [self-hosted, macOS, ARM64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up virtual environment & install locked dependencies
        run: |
          python3 -m venv .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH
          .venv/bin/python3 -m pip install --only-binary :all: -r requirements.txt

      - name: Run Linters & Security Scan
        run: |
          ruff check .
          bandit -r src/api -ll

      - name: Run Unit Tests with Coverage Gate
        run: |
          pytest --cov=src.api --cov-report=term --cov-fail-under=80 tests/

      - name: Verify RTM <-> Test Traceability
        run: |
          python3 scripts/verify_traceability.py

      - name: Verify OpenAPI Specification Sync
        run: |
          python3 -c "import sys; sys.path.insert(0, '.'); from src.api.main import app, save_openapi_spec; save_openapi_spec(app)"
          if [ -n "$(git status --porcelain docs/api/openapi-generated.yaml)" ]; then
            echo "::error::OpenAPI specification is out of sync with code! Please run the generator and commit docs/api/openapi-generated.yaml"
            git diff docs/api/openapi-generated.yaml
            exit 1
          fi
          echo "OpenAPI specification is synchronized with application code."
