name: Deploy API Docs

on:
  push:
    branches:
      - main

permissions:
  contents: write

# One docs deployment at a time; a newer push replaces a pending one
concurrency:
  group: deploy-docs
  cancel-in-progress: true

jobs:
  deploy-docs:
    # GitHub-hosted runner: the repository is public, and self-hosted runners must not run public repository code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare public directory
        run: |
          mkdir public
          cp -r docs public/
          echo '<meta http-equiv="refresh" content="0; url=docs/api/index.html" />' > public/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: false
