name: Flaky Tests Detection

on:
  workflow_dispatch:

jobs:
  flaky-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes --only-binary :all: -r requirements-lock.txt

      - name: Run tests 5 times
        shell: bash
        run: |
          mkdir -p flaky-results

          for i in {1..5}; do
            echo "===== Test run $i ====="

            pytest tests/ -v \
              --junitxml="flaky-results/run-$i.xml" \
              > "flaky-results/run-$i.log" 2>&1 || true
          done

      - name: Detect flaky tests
        run: |
          python scripts/detect_flaky_tests.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flaky-test-results
          path: flaky-results/