components:
  schemas:
    AdminUser:
      properties:
        user_id:
          type: string
          format: uuid
          title: User Id
        email:
          type: string
          title: Email
        nickname:
          type: string
          title: Nickname
        role:
          type: string
          title: Role
        status:
          type: string
          title: Status
        created_at:
          type: string
          format: date-time
          title: Created At
        ban:
          anyOf:
          - $ref: '#/components/schemas/BanInfo'
          - type: 'null'
          description: The ban in force, if any
      type: object
      required:
      - user_id
      - email
      - nickname
      - role
      - status
      - created_at
      title: AdminUser
    AdminUserList:
      properties:
        items:
          items:
            $ref: '#/components/schemas/AdminUser'
          type: array
          title: Items
        total:
          type: integer
          title: Total
      type: object
      required:
      - items
      - total
      title: AdminUserList
    BanCreate:
      properties:
        user_id:
          type: string
          format: uuid
          title: User Id
          description: User to ban
        ban_type:
          $ref: '#/components/schemas/BanType'
          description: '''temporary'' or ''permanent'''
        duration_days:
          anyOf:
          - type: integer
            maximum: 365.0
            minimum: 1.0
          - type: 'null'
          title: Duration Days
          description: Length of a temporary ban in days (1-365); not used for a permanent
            ban
        reason:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Reason
          description: Message shown to the banned user
      type: object
      required:
