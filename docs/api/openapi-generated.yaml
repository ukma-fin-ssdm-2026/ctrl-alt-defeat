openapi: 3.1.0
info:
  title: Movie Platform API
  description: REST API for managing content reviews and movies catalog.
  version: 1.0.0
paths:
  /health/live:
    get:
      tags:
      - health
      summary: Liveness check without touching the database (REL-001)
      description: 'For the hosting platform health check and the keep-alive ping:
        answers while the process is up and does not wake a serverless database that
        has scaled to zero. Use /health to check the database too.'
      operationId: liveness_health_live_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessResponse'
        '422':
          description: Validation Error (Unprocessable Entity)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /health:
    get:
      tags:
      - health
      summary: Health check for monitoring and container orchestration (REL-001)
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '422':
          description: Validation Error (Unprocessable Entity)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: The database is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/auth/register:
    post:
      tags:
      - Authentication & User Management
      summary: Register a new user account (FR-001)
      description: Registers a new account with email and password and sends an activation
        link to the email (FR-001). The account stays pending until the link is opened.
        The token itself is returned only on demo deployments (DEMO_MODE=true).
      operationId: register_user_api_v1_auth_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegisterRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '422':
          description: Validation Error (Unprocessable Entity)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email or nickname already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/resend-verification:
    post:
      tags:
      - Authentication & User Management
      summary: Send the activation link again (FR-001)
      description: Issues a new activation link for an account that is not verified
        yet. The answer is the same whether or not the email is registered, so it
        cannot be used to find accounts.
      operationId: resend_verification_api_v1_auth_resend_verification_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendVerificationRequest'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/src__api__schemas__auth__MessageResponse'
        '422':
          description: Validation Error (Unprocessable Entity)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/verify:
    get:
      tags:
      - Authentication & User Management
      summary: Confirm email address and activate account (FR-001, US-011)
      description: Validates verification token, activates user status, and sets email_verified
        to true.
      operationId: verify_email_api_v1_auth_verify_get
      parameters:
      - name: token
        in: query
        required: true
        schema:
          type: string
          description: Verification token sent in email
          title: Token
        description: Verification token sent in email
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyEmailResponse'
        '422':
          description: Validation Error (Unprocessable Entity)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Invalid or expired verification token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/login:
    post:
      tags:
      - Authentication & User Management
      summary: User login and JWT token issuance (T-037, US-011)
      description: Authenticates user by email and password using bcrypt. Returns
        signed JWT access token in response body and sets HttpOnly cookie.
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error (Unprocessable Entity)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Email is not verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/demo-accounts:
    get:
      tags:
      - Authentication & User Management
      summary: Demo accounts for the login window
      description: 'Public hint for demo deployments: the seed accounts configured
        in the environment. Returns `enabled: false` and no accounts unless the server
        runs with DEMO_MODE=true.'
      operationId: list_demo_accounts_api_v1_auth_demo_accounts_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DemoAccountsResponse'
        '422':
          description: Validation Error (Unprocessable Entity)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/me:
    get:
      tags:
      - Authentication & User Management
      summary: Get current authenticated user profile
      description: Returns profile information for the authenticated user using Bearer
        token or cookie.
      operationId: get_current_user_profile_api_v1_auth_me_get
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: access_token
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Access Token
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '422':
          description: Validation Error (Unprocessable Entity)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
      - Authentication & User Management
      summary: Delete my account and all my data
      description: Requires the current password. Removes the account with its reviews,
        ratings, comments, watchlist, watched list and ban history, and clears the
        session cookie.
      operationId: delete_my_account_api_v1_auth_me_delete
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: access_token
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Access Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAccountRequest'
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error (Unprocessable Entity)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Wrong current password or invalid new password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Demo (seed) or administrator account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/change-password:
    post:
      tags:
      - Authentication & User Management
      summary: Change my password
      description: Requires the current password. Demo (seed) accounts are managed
        by the server settings.
      operationId: change_my_password_api_v1_auth_change_password_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: access_token
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Access Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/src__api__schemas__auth__MessageResponse'
        '422':
          description: Validation Error (Unprocessable Entity)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Wrong current password or invalid new password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Demo (seed) or administrator account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/logout:
    post:
      tags:
      - Authentication & User Management
      summary: Log out and clear session cookie
      description: Clears the HttpOnly access_token cookie.
      operationId: logout_api_v1_auth_logout_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error (Unprocessable Entity)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/movies:
    get:
      tags:
      - Movies & Series Catalog
      summary: Get catalog of movies and series
      description: Retrieve list of movies and series with search by title, filters
        by category, genre, year, sorting (rating, release date, runtime) and offset
        pagination. Sorting is applied to the filtered result set; items with unknown
        values are always placed last.
      operationId: get_movies_api_v1_movies_get
      parameters:
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Search term in title (Ukrainian or English)
          title: Search
        description: Search term in title (Ukrainian or English)
      - name: category
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Category: ''Movie'' or ''Series'''
          title: Category
        description: 'Category: ''Movie'' or ''Series'''
      - name: genre
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Genre filter (e.g., 'Фантастика', 'Драма')
          title: Genre
        description: Genre filter (e.g., 'Фантастика', 'Драма')
      - name: year
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: Release year filter (e.g., 2024)
          title: Year
        description: Release year filter (e.g., 2024)
      - name: sort_by
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/ContentSortField'
          - type: 'null'
          description: 'Sort criterion: ''rating'', ''release_date'' (release year)
            or ''runtime'''
          title: Sort By
        description: 'Sort criterion: ''rating'', ''release_date'' (release year)
          or ''runtime'''
      - name: order
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/SortOrder'
          description: 'Sort direction: ''desc'' (default) or ''asc'''
          default: desc
        description: 'Sort direction: ''desc'' (default) or ''asc'''
      - name: skip
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Number of items to skip
          default: 0
          title: Skip
        description: Number of items to skip
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Maximum items per page
          default: 20
          title: Limit
        description: Maximum items per page
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedContentResponse'
        '422':
          description: Validation Error (Unprocessable Entity)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/movies/{movie_id}:
    get:
      tags:
      - Movies & Series Catalog
      summary: Get movie details by ID or content UUID
      description: Retrieve a single movie or series by its numeric ID or UUID content_id.
      operationId: get_movie_by_id_api_v1_movies__movie_id__get
      parameters:
      - name: movie_id
        in: path
        required: true
        schema:
          type: string
          title: Movie Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentResponse'
        '422':
          description: Validation Error (Unprocessable Entity)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/reviews:
    post:
      tags:
      - reviews
      summary: Create a new review
      operationId: create_review_api_v1_reviews_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: access_token
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Access Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResponse'
        '422':
          description: Validation Error (Unprocessable Entity)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: User is not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not allowed (title not watched, not the author, banned or unverified)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: User has already reviewed this content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags:
      - reviews
      summary: Get a list of reviews (with pagination)
      operationId: get_reviews_api_v1_reviews_get
      parameters:
      - name: content_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid4
          - type: 'null'
          description: Filter by content ID
          title: Content Id
        description: Filter by content ID
      - name: user_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid4
          - type: 'null'
          description: Filter by user ID
          title: User Id
        description: Filter by user ID
      - name: min_rating
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 10
            minimum: 1
          - type: 'null'
          description: Filter by minimum rating (1-10)
          title: Min Rating
        description: Filter by minimum rating (1-10)
      - name: skip
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Offset for pagination
          default: 0
          title: Skip
        description: Offset for pagination
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Maximum number of items per page
          default: 10
          title: Limit
        description: Maximum number of items per page
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedReviewsResponse'
        '422':
          description: Validation Error (Unprocessable Entity)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
      - reviews
      summary: Delete a review by query parameter (FR-008, US-006)
      description: Same as DELETE /reviews/{review_id}, with the id as a query parameter
        (constant client URLs).
      operationId: delete_review_by_query_api_v1_reviews_delete
      parameters:
      - name: review_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
          description: ID of the review to delete
          title: Review Id
        description: ID of the review to delete
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: access_token
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Access Token
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error (Unprocessable Entity)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'Forbidden: BOLA violation (author or admin required)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/reviews/summary:
    get:
      tags:
      - reviews
      summary: 'Audience rating of a movie: average, number of ratings and reviews
        (US-008)'
      operationId: get_review_summary_api_v1_reviews_summary_get
      parameters:
      - name: content_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
          description: Movie or series to summarize
          title: Content Id
        description: Movie or series to summarize
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewSummaryResponse'
        '422':
          description: Validation Error (Unprocessable Entity)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/reviews/{review_id}:
    get:
      tags:
      - reviews
      summary: Get a specific review by ID
      operationId: get_review_api_v1_reviews__review_id__get
      parameters:
      - name: review_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: ID of the review
          title: Review Id
        description: ID of the review
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResponse'
        '422':
          description: Validation Error (Unprocessable Entity)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags:
      - reviews
      summary: Partially update my review
      operationId: update_review_api_v1_reviews__review_id__patch
      parameters:
      - name: review_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: ID of the review to update
          title: Review Id
        description: ID of the review to update
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      - name: access_token
        in: cookie
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Access Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResponse'
        '422':
          description: Validation Error (Unprocessable Entity)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: User is not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not allowed (title not watched, not the author, banned or unverified)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
