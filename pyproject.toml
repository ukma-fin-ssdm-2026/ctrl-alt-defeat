[project]
name = "pislya-tytriv"
# Semantic Versioning; the same number is in frontend/package.json, CHANGELOG.md and the git tag (v<version>)
version = "1.0.2"
description = "«Після титрів» — сайт рецензій та рекомендацій фільмів і серіалів"
requires-python = ">=3.11"

[tool.black]
line-length = 120
target-version = ['py311']

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = []

[tool.pytest.ini_options]
pythonpath = ["src/api", "."]
testpaths = ["tests"]
